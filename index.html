<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>像素吞噬者</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #05060a;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
  }
  #wrap {
    position: relative;
    box-shadow: 0 0 80px rgba(80,140,255,0.15);
    border-radius: 12px;
    overflow: hidden;
  }
  canvas { display: block; cursor: none; }
  #hud {
    position: absolute;
    top: 16px;
    left: 20px;
    color: #9fb4ff;
    font-size: 14px;
    letter-spacing: 1px;
    pointer-events: none;
    text-shadow: 0 0 8px rgba(80,140,255,0.6);
  }
  #hud span { color: #fff; font-weight: 700; }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: rgba(5,6,10,0.85);
    color: #dce6ff;
    text-align: center;
    backdrop-filter: blur(4px);
    transition: opacity .4s;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  #overlay h1 {
    font-size: 34px;
    margin-bottom: 12px;
    letter-spacing: 4px;
    background: linear-gradient(90deg,#5b8cff,#a45bff,#5bffd0);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  #overlay p { font-size: 14px; line-height: 1.9; color: #8fa3cc; max-width: 340px; }
  #overlay .key { color: #5bffd0; font-weight: 700; }
  #overlay button {
    margin-top: 22px;
    padding: 12px 38px;
    font-size: 15px;
    letter-spacing: 3px;
    color: #05060a;
    background: linear-gradient(90deg,#5bffd0,#5b8cff);
    border: none;
    border-radius: 30px;
    cursor: pointer;
    font-weight: 700;
    transition: transform .2s, box-shadow .2s;
  }
  #overlay button:hover {
    transform: scale(1.06);
    box-shadow: 0 0 24px rgba(91,255,208,0.6);
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="820" height="560"></canvas>
  <div id="hud">
    关卡 <span id="lvl">1</span> &nbsp;|&nbsp; 剩余光点 <span id="dots">0</span> &nbsp;|&nbsp; 体型 <span id="size">10</span>
  </div>
  <div id="overlay">
    <h1>像素吞噬者</h1>
    <p>
      移动鼠标操控黑洞，吞掉所有<span class="key">蓝色光点</span>过关。<br>
      吃光点会<span class="key">变大变慢</span>，吃白色反物质会<span class="key">缩小变快</span>。<br>
      利用体型变化穿过狭窄缝隙，别让黑洞超出边界。
    </p>
    <button id="startBtn">开 始</button>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');
const lvlEl = document.getElementById('lvl');
const dotsEl = document.getElementById('dots');
const sizeEl = document.getElementById('size');

let mouse = { x: W/2, y: H/2 };
let keys = {};
let game = null;
let running = false;
let animId = null;

// ---------- 音效（WebAudio 合成，无需外部文件）----------
let audioCtx = null;
function beep(freq, dur, type='sine', vol=0.08) {
  if (!audioCtx) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type;
  o.frequency.value = freq;
  g.gain.setValueAtTime(vol, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime + dur);
}

// ---------- 实体 ----------
class Particle {
  constructor(x, y, color) {
    this.x = x; this.y = y;
    const a = Math.random() * Math.PI * 2;
    const s = Math.random() * 4 + 1;
    this.vx = Math.cos(a) * s;
    this.vy = Math.sin(a) * s;
    this.life = 1;
    this.color = color;
    this.r = Math.random() * 3 + 1;
  }
  update() {
    this.x += this.vx; this.y += this.vy;
    this.vx *= 0.94; this.vy *= 0.94;
    this.life -= 0.02;
  }
  draw() {
    ctx.globalAlpha = Math.max(this.life, 0);
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r * this.life, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

class Dot {
  constructor(x, y, type) {
    this.x = x; this.y = y;
    this.type = type; // 'food' | 'anti'
    this.r = type === 'food' ? 5 : 7;
    this.pulse = Math.random() * Math.PI * 2;
    this.dead = false;
  }
  update() {
    this.pulse += 0.08;
  }
  draw() {
    const pr = this.r + Math.sin(this.pulse) * 1.5;
    ctx.save();
    ctx.shadowBlur = 18;
    if (this.type === 'food') {
      ctx.shadowColor = '#5b8cff';
      ctx.fillStyle = '#8fb4ff';
    } else {
      ctx.shadowColor = '#ffffff';
      ctx.fillStyle = '#ffffff';
    }
    ctx.beginPath();
    ctx.arc(this.x, this.y, pr, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
}

class Hole {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.vx = 0; this.vy = 0;
    this.baseR = 10;
    this.r = 10;
    this.maxR = 70;
    this.minR = 8;
  }
  get speedFactor() {
    // 越大越慢
    return 1.6 - (this.r - this.minR) / (this.maxR - this.minR) * 1.2;
  }
  update() {
    // 朝鼠标方向带惯性移动
    const dx = mouse.x - this.x;
    const dy = mouse.y - this.y;
    const acc = 0.9 * this.speedFactor;
    this.vx += dx * 0.006 * acc;
    this.vy += dy * 0.006 * acc;
    this.vx *= 0.90;
    this.vy *= 0.90;
    this.x += this.vx;
    this.y += this.vy;

    // 边界反弹
    if (this.x - this.r < 0) { this.x = this.r; this.vx *= -0.5; }
    if (this.x + this.r > W) { this.x = W - this.r; this.vx *= -0.5; }
    if (this.y - this.r < 0) { this.y = this.r; this.vy *= -0.5; }
    if (this.y + this.r > H) { this.y = H - this.r; this.vy *= -0.5; }

    // 半径平滑趋近目标
    this.r += (this.targetR - this.r) * 0.08;
  }
  draw() {
    // 引力扭曲光环
    const g = ctx.createRadialGradient(this.x, this.y, this.r*0.4, this.x, this.y, this.r*2.2);
    g.addColorStop(0, 'rgba(120,90,255,0.35)');
    g.addColorStop(0.5, 'rgba(80,120,255,0.10)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r*2.2, 0, Math.PI*2);
    ctx.fill();

    // 事件视界
    ctx.save();
    ctx.shadowBlur = 30;
    ctx.shadowColor = '#7a5bff';
    ctx.fillStyle = '#0a0a12';
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();

    // 边缘亮环
    ctx.strokeStyle = 'rgba(150,120,255,0.9)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI*2);
    ctx.stroke();
  }
}

// ---------- 关卡生成 ----------
function makeLevel(level) {
  const dots = [];
  const count = 14 + level * 5;
  const margin = 60;
  for (let i = 0; i < count; i++) {
    dots.push(new Dot(
      margin + Math.random() * (W - margin*2),
      margin + Math.random() * (H - margin*2),
      'food'
    ));
  }
  // 反物质数量随关卡增加
  const antiCount = 2 + Math.floor(level / 2);
  for (let i = 0; i < antiCount; i++) {
    dots.push(new Dot(
      margin + Math.random() * (W - margin*2),
      margin + Math.random() * (H - margin*2),
      'anti'
    ));
  }
  return dots;
}

function resetLevel(level) {
  game = {
    hole: new Hole(W/2, H/2),
    dots: makeLevel(level),
    particles: [],
    level: level,
    totalFood: 0,
    eaten: 0,
    shake: 0,
    time: 0
  };
  game.hole.targetR = game.hole.r;
  game.totalFood = game.dots.filter(d => d.type === 'food').length;
  updateHUD();
}

function updateHUD() {
  lvlEl.textContent = game.level;
  dotsEl.textContent = game.totalFood - game.eaten;
  sizeEl.textContent = Math.round(game.hole.r);
}

// ---------- 游戏主循环 ----------
function loop() {
  if (!running) return;
  game.time++;
  game.shake *= 0.9;

  ctx.fillStyle = '#05060a';
  ctx.fillRect(0, 0, W, H);

  // 网格背景
  ctx.strokeStyle = 'rgba(60,90,160,0.08)';
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 40) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = 0; y < H; y += 40) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }

  ctx.save();
  if (game.shake > 0.5) {
    ctx.translate((Math.random()-0.5)*game.shake, (Math.random()-0.5)*game.shake);
  }

  // 更新黑洞
  game.hole.update();

  // 更新光点
  for (const d of game.dots) {
    if (d.dead) continue;
    d.update();

    // 黑洞吸引
    const dx = game.hole.x - d.x;
    const dy = game.hole.y - d.y;
    const dist = Math.hypot(dx, dy);
    const pullRadius = game.hole.r * 3.5;
    if (dist < pullRadius && dist > 1) {
      const force = (1 - dist / pullRadius) * 0.6;
      d.x += (dx / dist) * force * 3;
      d.y += (dy / dist) * force * 3;
    }

    // 吞噬判定
    if (dist < game.hole.r + d.r * 0.5) {
      d.dead = true;
      if (d.type === 'food') {
        game.eaten++;
        game.hole.targetR = Math.min(game.hole.maxR, game.hole.targetR + 4);
        for (let i = 0; i < 10; i++) game.particles.push(new Particle(d.x, d.y, '#8fb4ff'));
        beep(520 + Math.random()*200, 0.12, 'sine', 0.06);
      } else {
        game.hole.targetR = Math.max(game.hole.minR, game.hole.targetR - 12);
        for (let i = 0; i < 16; i++) game.particles.push(new Particle(d.x, d.y, '#ffffff'));
        game.shake = 14;
        beep(160, 0.25, 'sawtooth', 0.08);
      }
      updateHUD();
    }
  }

  // 绘制光点
  for (const d of game.dots) if (!d.dead) d.draw();

  // 绘制黑洞
  game.hole.draw();

  // 粒子
  game.particles = game.particles.filter(p => p.life > 0);
  for (const p of game.particles) { p.update(); p.draw(); }

  ctx.restore();

  // 过关判定
  if (game.eaten >= game.totalFood) {
    running = false;
    beep(660, 0.15, 'sine', 0.1);
    setTimeout(() => beep(880, 0.3, 'sine', 0.1), 150);
    showOverlay(`关卡 ${game.level} 完成！`, '进入更难的下一关', '下一关', () => {
      resetLevel(game.level + 1);
      running = true;
      loop();
    });
    return;
  }

  animId = requestAnimationFrame(loop);
}

// ---------- 覆盖层控制 ----------
let overlayAction = null;
function showOverlay(title, desc, btnText, action) {
  overlay.innerHTML = `
    <h1>${title}</h1>
    <p>${desc}</p>
    <button id="startBtn">${btnText}</button>
  `;
  overlay.classList.remove('hidden');
  overlayAction = action;
  document.getElementById('startBtn').onclick = () => {
    overlay.classList.add('hidden');
    if (overlayAction) overlayAction();
  };
}

// ---------- 输入 ----------
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  mouse.x = (e.clientX - rect.left) * (W / rect.width);
  mouse.y = (e.clientY - rect.top) * (H / rect.height);
});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const t = e.touches[0];
  mouse.x = (t.clientX - rect.left) * (W / rect.width);
  mouse.y = (t.clientY - rect.top) * (H / rect.height);
}, { passive: false });

// ---------- 启动 ----------
startBtn.onclick = () => {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
  overlay.classList.add('hidden');
  resetLevel(1);
  running = true;
  loop();
};
</script>
</body>
</html>
