<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>😎 表情包大作战 · 乐子点击器</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #1a1e2b 0%, #2d3349 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      margin: 0;
    }

    .game-container {
      background: rgba(22, 26, 38, 0.85);
      backdrop-filter: blur(8px);
      border-radius: 64px 64px 48px 48px;
      padding: 28px 36px 42px;
      box-shadow: 0 30px 40px rgba(0, 0, 0, 0.6), inset 0 1px 4px rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 215, 100, 0.2);
      max-width: 760px;
      width: 100%;
      transition: all 0.2s;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      background: #0f121c;
      padding: 16px 26px;
      border-radius: 100px;
      border: 1px solid #ffd96633;
      box-shadow: inset 0 4px 8px #00000055, 0 6px 12px #00000030;
    }

    .score-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .score-label {
      color: #b9c2da;
      font-weight: 600;
      font-size: 1.2rem;
      letter-spacing: 1px;
      text-shadow: 0 2px 4px black;
    }

    .score-value {
      color: #ffe484;
      font-size: 2.8rem;
      font-weight: 900;
      line-height: 1;
      text-shadow: 0 0 16px #ffb347, 0 4px 8px black;
      transition: transform 0.1s ease;
      min-width: 90px;
      text-align: center;
    }

    .score-value.bump {
      transform: scale(1.3);
    }

    .timer-box {
      background: #21273b;
      padding: 10px 22px;
      border-radius: 60px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: inset 0 2px 6px #00000088, 0 5px 0 #0b0d14;
      border: 1px solid #555e7a;
    }

    .timer-icon {
      font-size: 2rem;
      filter: drop-shadow(0 2px 4px black);
    }

    .timer-text {
      color: #eef3ff;
      font-size: 2.2rem;
      font-weight: 800;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 10px #5faaff, 0 2px 0 black;
      min-width: 80px;
      text-align: center;
    }

    .arena {
      background: #191e2b;
      border-radius: 60px;
      padding: 26px 24px 32px;
      border: 2px solid #3a4057;
      box-shadow: inset 0 0 40px #00000099, 0 20px 30px #0000004d;
      margin-bottom: 28px;
      position: relative;
      transition: border-color 0.2s;
    }

    .arena.border-pulse {
      border-color: #ffd966;
    }

    .emoji-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      justify-items: center;
      align-items: center;
      min-height: 260px;
      position: relative;
      z-index: 2;
    }

    .emoji-btn {
      background: #262d40;
      border: none;
      border-radius: 32px;
      width: 100%;
      aspect-ratio: 1 / 1;
      font-size: 3.8rem;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 12px 0 #0b0e15, 0 8px 18px black, inset 0 -2px 8px #ffffff33, inset 0 4px 8px #ffffff1a;
      transition: all 0.08s linear;
      transform: translateY(-4px);
      border: 1px solid #ffffff1e;
      will-change: transform, box-shadow;
      padding: 0;
      line-height: 1;
      filter: drop-shadow(0 0 6px #ffd96655);
    }

    .emoji-btn:hover {
      background: #303952;
      filter: drop-shadow(0 0 12px #ffeeaa);
    }

    .emoji-btn:active {
      transform: translateY(6px) scale(0.96);
      box-shadow: 0 4px 0 #0b0e15, 0 8px 18px black, inset 0 -2px 8px #ffffff33;
    }

    /* 被点击时的特殊效果（会移除） */
    .emoji-btn.pop {
      animation: pop 0.2s cubic-bezier(0.2, 1.6, 0.4, 1);
    }

    @keyframes pop {
      0% { transform: scale(1) translateY(0); }
      40% { transform: scale(1.25) translateY(-8px); background: #4a546e; }
      100% { transform: scale(1) translateY(-4px); }
    }

    .action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      padding: 0 8px;
    }

    .reset-btn {
      background: #2a3149;
      border: none;
      border-radius: 50px;
      padding: 14px 28px;
      color: #f0e6c5;
      font-weight: 700;
      font-size: 1.3rem;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: 0 8px 0 #0f121d, 0 10px 20px black;
      transition: all 0.08s linear;
      border: 1px solid #ffd96666;
      transform: translateY(-2px);
      text-shadow: 0 2px 4px black;
    }

    .reset-btn:active {
      transform: translateY(6px);
      box-shadow: 0 2px 0 #0f121d, 0 8px 18px black;
    }

    .reset-btn span {
      font-size: 1.8rem;
      line-height: 1;
    }

    .status-message {
      font-size: 1.4rem;
      font-weight: 600;
      color: #aab3d0;
      background: #0f121c;
      padding: 12px 32px;
      border-radius: 60px;
      box-shadow: inset 0 3px 8px #00000099;
      border: 1px solid #5f6a8a;
      text-align: center;
      flex: 1;
      letter-spacing: 0.5px;
      transition: all 0.2s;
      min-height: 4rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .status-message.combo-flash {
      color: #ffe484;
      background: #20273f;
      box-shadow: 0 0 20px #ffbb33, inset 0 0 8px #ffd966;
      border-color: #ffd966;
    }

    .combo-tag {
      color: #ffc107;
      font-size: 1.9rem;
      font-weight: 900;
      text-shadow: 0 0 12px orange;
      vertical-align: middle;
    }

    /* 适配小屏 */
    @media (max-width: 560px) {
      .game-container { padding: 18px 18px 28px; }
      .emoji-grid { gap: 10px; }
      .emoji-btn { font-size: 2.6rem; border-radius: 24px; }
      .score-value { font-size: 2rem; min-width: 70px; }
      .timer-text { font-size: 1.8rem; min-width: 60px; }
      .timer-icon { font-size: 1.6rem; }
      .status-message { font-size: 1.1rem; padding: 8px 14px; }
      .reset-btn { font-size: 1rem; padding: 10px 18px; }
      .reset-btn span { font-size: 1.4rem; }
    }
  </style>
</head>
<body>
<div class="game-container">
  <!-- 头部计分 + 倒计时 -->
  <div class="header">
    <div class="score-wrap">
      <span class="score-label">🎯 得分</span>
      <span class="score-value" id="scoreDisplay">0</span>
    </div>
    <div class="timer-box">
      <span class="timer-icon">⏳</span>
      <span class="timer-text" id="timerDisplay">30</span>
    </div>
  </div>

  <!-- 游戏主区域 -->
  <div class="arena" id="arena">
    <div class="emoji-grid" id="emojiGrid">
      <!-- 动态生成 4x2 = 8 个表情按钮，但用js生成也行，这里用静态占位保证不出错，js会替换 -->
    </div>
  </div>

  <!-- 底部控制 + 状态 -->
  <div class="action-bar">
    <button class="reset-btn" id="resetBtn"><span>🔄</span> 重来</button>
    <div class="status-message" id="statusMsg">点击表情包！别停！</div>
  </div>
</div>

<script>
  (function(){
    // ----- 游戏配置 (保守安全，无高级API) -----
    const EMOJIS = ['😂', '🤣', '😎', '🥳', '😜', '🤪', '😝', '🙃', '😏', '🥸', '🤩', '😇', '🐶', '🐱', '🦊', '🐼'];
    const GRID_SIZE = 8;          // 4x2 = 8个格子
    const INIT_TIME = 30;         // 30秒倒计时
    const POINTS_PER_HIT = 10;    // 每次点击基础分
    const COMBO_BONUS = 5;        // 连击额外加分基数 (第n次连击加 n*5)

    // ----- DOM 元素 -----
    const scoreDisplay = document.getElementById('scoreDisplay');
    const timerDisplay = document.getElementById('timerDisplay');
    const emojiGrid = document.getElementById('emojiGrid');
    const resetBtn = document.getElementById('resetBtn');
    const statusMsg = document.getElementById('statusMsg');
    const arena = document.getElementById('arena');

    // ----- 游戏状态 -----
    let score = 0;
    let timeLeft = INIT_TIME;
    let gameActive = false;       // true 表示游戏进行中
    let timerInterval = null;

    // 连击计数器 (连续点击同一个表情不重置，点击不同表情重置? 为了趣味: 点击不同表情重置连击)
    let lastEmoji = null;         // 上一次点击的表情符号
    let comboCount = 0;           // 当前连击次数 (连续点击同一个表情)

    // 存储所有按钮元素，用于更新表情
    let emojiButtons = [];

    // ----- 辅助函数 -----
    // 随机获取一个表情
    function getRandomEmoji() {
      return EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
    }

    // 更新分数显示 (带动画类)
    function updateScoreUI(animate = true) {
      scoreDisplay.textContent = score;
      if (animate) {
        scoreDisplay.classList.add('bump');
        setTimeout(() => {
          scoreDisplay.classList.remove('bump');
        }, 100);
      }
    }

    // 更新计时器显示
    function updateTimerUI() {
      timerDisplay.textContent = timeLeft;
    }

    // 设置状态消息 (可带闪烁效果)
    function setStatusMessage(text, flash = false) {
      statusMsg.textContent = text;
      if (flash) {
        statusMsg.classList.add('combo-flash');
        setTimeout(() => {
          statusMsg.classList.remove('combo-flash');
        }, 300);
      }
    }

    // 为所有按钮分配新表情 (并重置连击)
    function randomizeAllButtons() {
      for (let btn of emojiButtons) {
        btn.textContent = getRandomEmoji();
      }
    }

    // 停止计时器 (清除interval)
    function stopTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    // 开始倒计时
    function startTimer() {
      stopTimer(); // 确保没有残留
      timerInterval = setInterval(() => {
        if (!gameActive) return; // 如果游戏非活跃，不减少时间(但会继续跑，后面会停止)
        if (timeLeft > 0) {
          timeLeft -= 1;
          updateTimerUI();

          // 倒计时少于5秒时改变颜色 (可选，不加也行)
          if (timeLeft <= 5) {
            timerDisplay.style.color = '#ff7b7b';
          } else {
            timerDisplay.style.color = '#eef3ff';
          }

          // 时间到0，结束游戏
          if (timeLeft <= 0) {
            timeLeft = 0;
            updateTimerUI();
            endGame();
          }
        }
      }, 1000);
    }

    // 结束游戏 (时间到)
    function endGame() {
      gameActive = false;
      stopTimer();
      // 禁用所有按钮点击 (视觉上通过指针事件禁用，但保留样式)
      emojiButtons.forEach(btn => {
        btn.disabled = true;
        btn.style.opacity = '0.7';
        btn.style.cursor = 'default';
      });
      setStatusMessage('⏰ 时间到！点“重来”继续嗨！', true);
      arena.classList.add('border-pulse');
      setTimeout(() => arena.classList.remove('border-pulse'), 600);
    }

    // 重置游戏至初始状态
    function resetGame() {
      // 停止任何进行中的计时器
      stopTimer();

      // 重置变量
      gameActive = true;
      score = 0;
      timeLeft = INIT_TIME;
      comboCount = 0;
      lastEmoji = null;

      // 更新UI
      updateScoreUI(false);
      updateTimerUI();
      timerDisplay.style.color = '#eef3ff'; // 恢复颜色

      // 恢复所有按钮
      emojiButtons.forEach(btn => {
        btn.disabled = false;
        btn.style.opacity = '1';
        btn.style.cursor = 'pointer';
        // 表情随机 (后面randomize会再做一次，但为了保险)
      });
      randomizeAllButtons(); // 重置所有表情

      // 重置状态消息
      setStatusMessage('⚡ 快点击表情包！连击有加分！', false);
      statusMsg.classList.remove('combo-flash');

      // 移除竞技场高亮
      arena.classList.remove('border-pulse');

      // 开始倒计时
      startTimer();
    }

    // 处理表情点击
    function onEmojiClick(event) {
      const btn = event.currentTarget;
      if (!gameActive) return;         // 游戏未激活，忽略
      if (btn.disabled) return;        // 按钮被禁用 (额外安全)

      // 获取当前按钮上的表情
      const currentEmoji = btn.textContent;

      // 连击逻辑：如果和上次点击的表情相同，连击+1，否则重置为1
      if (currentEmoji === lastEmoji) {
        comboCount += 1;
      } else {
        comboCount = 1;   // 新表情，连击从1开始
        lastEmoji = currentEmoji;
      }

      // 计算本次得分: 基础分 + 连击奖励 (第2次连击起才有额外奖励，更刺激)
      let pointsEarned = POINTS_PER_HIT;
      if (comboCount > 1) {
        // 连击奖励：第2次加5分，第3次加10分... 最多不超过25额外分防止太离谱
        const bonus = Math.min(COMBO_BONUS * (comboCount - 1), 25);
        pointsEarned += bonus;
      }

      // 累加分数
      score += pointsEarned;

      // 更新分数显示 (带弹跳动画)
      updateScoreUI(true);

      // 按钮动画 (pop类)
      btn.classList.add('pop');
      // 短暂延迟后移除，让动画可以多次触发
      setTimeout(() => {
        btn.classList.remove('pop');
      }, 200);

      // 修改按钮表情 (点击后随机变成另一个表情，增加趣味和连击变数)
      const newEmoji = getRandomEmoji();
      btn.textContent = newEmoji;

      // 如果新表情恰好和上次相同 (小概率)，我们让连击保留？但是为了公平，还是看下次点击。
      // 但这里注意：lastEmoji仍然保持为之前点击的表情，用户下次点击这个按钮如果正好是newEmoji且等于lastEmoji才触发连击。
      // 然而我们要更新lastEmoji吗？ 按照设计：点击后按钮变了，但是连击是基于用户点击那一刻的表情。
      // 所以我们不改变lastEmoji，保留之前的。如果用户下次点击其他表情，且那个表情恰好等于lastEmoji，仍然会连击（因为相同）。
      // 这样比较合理：用户连续点击具有相同表情的按钮（不论位置）就能连击，但按钮会变，所以他们会追逐那个表情。
      // 为了更有乐子，lastEmoji保留用户点击时刻的表情。没问题。

      // 但还有个问题：如果新表情恰好和lastEmoji相同，且用户马上再点同一个按钮，那就会继续连击。更快乐！

      // 显示连击消息 (如果连击大于1)
      if (comboCount > 1) {
        setStatusMessage(`🔥 连击 x${comboCount}！ +${pointsEarned}分`, true);
      } else {
        setStatusMessage(`😝 +${pointsEarned}分`, false);
      }

      // 连击音效？没有音频，但我们可以再闪一下状态

      // 额外：如果分数超过某个值可以加彩蛋？不加，保持简洁但有趣
    }

    // 初始化UI: 创建8个表情按钮
    function buildGameBoard() {
      // 清空网格
      emojiGrid.innerHTML = '';
      emojiButtons = [];

      for (let i = 0; i < GRID_SIZE; i++) {
        const btn = document.createElement('button');
        btn.className = 'emoji-btn';
        btn.textContent = getRandomEmoji();  // 初始随机表情
        btn.addEventListener('click', onEmojiClick);
        // 防止移动端双击缩放干扰
        btn.addEventListener('touchstart', (e) => {
          // 只是为了流畅，不阻止默认，但是点击事件会照常触发
        }, { passive: true });

        emojiGrid.appendChild(btn);
        emojiButtons.push(btn);
      }
    }

    // 页面初始化
    function initGame() {
      buildGameBoard();
      // 重置状态并开始
      resetGame();

      // 重置按钮监听
      resetBtn.addEventListener('click', () => {
        // 重置时如果游戏还在进行也强制重置
        resetGame();
      });
    }

    // 页面加载后启动
    window.addEventListener('DOMContentLoaded', initGame);
  })();
</script>
</body>
</html>
